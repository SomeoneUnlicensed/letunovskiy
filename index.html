<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Владимир Летуновский — разработчик</title>
<meta name="description" content="Владимир Летуновский — разработчик из Москвы.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Владимир Летуновский">
<meta property="og:description" content="Разработчик из Москвы.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://someoneunlicensed.github.io/letunovskiy/">
<meta property="og:site_name" content="Владимир Летуновский">
<meta property="og:locale" content="ru_RU">
<link rel="canonical" href="https://someoneunlicensed.github.io/letunovskiy/">
<style>
:root{--paper:#fff;--ink:#111;--muted:#777;--line:#ddd;--pad:clamp(20px,4vw,64px)}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.45 Arial,sans-serif}
main{min-height:100svh;padding:var(--pad);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}
.language{display:flex;gap:12px;font:14px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.language button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer;font:inherit}
.language button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.card{margin:auto 0;max-width:980px;width:100%}
h1{margin:0;font-size:clamp(56px,13vw,190px);line-height:.82;letter-spacing:-.08em;font-weight:700}
.first-name{display:block;color:var(--muted);font-size:clamp(20px,3vw,42px);line-height:1;margin:24px 0 0;letter-spacing:-.04em}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:clamp(72px,13vw,180px);border-top:1px solid var(--line);padding-top:18px}
.label{color:var(--muted);font:13px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.value{font-size:clamp(20px,2.4vw,32px);letter-spacing:-.04em}
.stack{grid-column:span 2}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
a:hover{color:var(--muted)}
footer{display:flex;justify-content:space-between;gap:20px;margin-top:80px;color:var(--muted);font-size:14px}
@media(max-width:600px){main{padding:20px}.details{grid-template-columns:1fr 1fr;gap:28px 16px;margin-top:80px}.stack{grid-column:span 2}footer{margin-top:64px}}
</style>
</head>
<body>
<main>
  <header>
    <span>2026</span>
    <nav class="language" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </nav>
  </header>

  <section class="card" aria-live="polite">
    <h1 data-ru="Летуновский" data-en="Letunovskiy">Летуновский</h1>
    <p class="first-name" data-ru="Владимир" data-en="Vladimir">Владимир</p>
    <div class="details">
      <div>
        <div class="label" data-ru="Возраст" data-en="Age">Возраст</div>
        <div class="value" data-ru="14 лет" data-en="14 years old">14 лет</div>
      </div>
      <div>
        <div class="label" data-ru="Город" data-en="City">Город</div>
        <div class="value" data-ru="Москва" data-en="Moscow">Москва</div>
      </div>
      <div class="stack">
        <div class="label" data-ru="Стек" data-en="Stack">Стек</div>
        <div class="value">Go · Python · TypeScript · React · PostgreSQL · Docker · Figma</div>
      </div>
      <div>
        <div class="label" data-ru="GitHub" data-en="GitHub">GitHub</div>
        <div class="value"><a href="https://github.com/SomeoneUnlicensed">SomeoneUnlicensed</a></div>
      </div>
    </div>
  </section>

  <footer>
    <span data-ru="С 6 октября 2026" data-en="Since 6 October 2026">С 6 октября 2026</span>
    <span>© Vladimir Letunovskiy</span>
  </footer>
</main>
<script>
(() => {
  const buttons = document.querySelectorAll('[data-lang]');
  const translated = document.querySelectorAll('[data-ru][data-en]');
  const title = document.querySelector('title');
  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      const lang = button.dataset.lang;
      document.documentElement.lang = lang;
      translated.forEach((element) => { element.textContent = element.dataset[lang]; });
      buttons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      title.textContent = lang === 'ru'
        ? 'Владимир Летуновский — разработчик'
        : 'Vladimir Letunovskiy — developer';
    });
  });
})();
</script>
</body>
</html>
